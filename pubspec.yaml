name: crux
description: "Crux — an offline-first gym app with AI coaching, deep gamification, and a lifetime progression system."
publish_to: 'none'

version: 1.0.8+9

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2   # state management (global requirement)
  go_router: ^17.3.0         # declarative routing for the app shell
  intl: ^0.20.2              # locale-aware formatting + l10n message support (SDK-pinned)
  image_picker: ^1.1.2       # local-only progress photos (Phase 4 body tracking)
  shared_preferences: ^2.3.2 # local-first persistence (survives app restart)
  supabase_flutter: ^2.8.0   # optional cloud auth/sync/AI; gated by --dart-define
  flutter_local_notifications: ^19.0.0 # training-day + hydration reminders
  timezone: ^0.10.0          # zoned scheduling for daily reminders
  flutter_timezone: ^4.0.0   # device timezone lookup for scheduling
  audioplayers: ^6.7.1
  vibration: ^3.1.8
  url_launcher: ^6.3.1        # privacy policy / support links from Settings
  in_app_purchase: ^3.2.0     # Google Play Billing for Pro (server-verified)
  http: ^1.2.0                # auth provider discovery (/auth/v1/settings)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/sounds/

  fonts:
    # Display face — headlines, weight numerals, hero type (Fontshare, bundled locally).
    - family: ClashDisplay
      fonts:
        - asset: fonts/ClashDisplay-Regular.ttf
          weight: 400
        - asset: fonts/ClashDisplay-Medium.ttf
          weight: 500
        - asset: fonts/ClashDisplay-Semibold.ttf
          weight: 600
        - asset: fonts/ClashDisplay-Bold.ttf
          weight: 700
    # Body / UI face (Fontshare, bundled locally).
    - family: GeneralSans
      fonts:
        - asset: fonts/GeneralSans-Regular.ttf
          weight: 400
        - asset: fonts/GeneralSans-Medium.ttf
          weight: 500
        - asset: fonts/GeneralSans-Semibold.ttf
          weight: 600
        - asset: fonts/GeneralSans-Bold.ttf
          weight: 700
    # Tabular-figure mono — numerals, timers (so changing digits never jitter).
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: fonts/JetBrainsMono-Bold.ttf
          weight: 700
