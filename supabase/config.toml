# Crux — Supabase local/project configuration.
# Docs: https://supabase.com/docs/guides/cli/config
# `project_id` is used as a namespace for the local dev stack (docker containers).

project_id = "crux"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323

[inbucket]
# Local email testing (catches OTP / magic-link mails during dev).
enabled = true
port = 54324

[storage]
enabled = true
# Progress photos are local-only per the product spec; this bucket is optional
# and only used if the user opts into cloud photo backup later.
file_size_limit = "50MiB"

[auth]
enabled = true
# The app is fully usable anonymously; auth is only prompted for sync + AI.
site_url = "io.supabase.crux://login-callback/"
additional_redirect_urls = ["io.supabase.crux://login-callback/"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Anonymous sign-ins let a user sync a device without an email first.
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
# Email OTP (6-digit code) per Phase 6.
otp_length = 6
otp_expiry = 3600

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[auth.external.apple]
enabled = false
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[analytics]
enabled = false

[edge_runtime]
enabled = true
# Edge functions are invoked per-request; keep them warm-ish in dev.
policy = "oneshot"
